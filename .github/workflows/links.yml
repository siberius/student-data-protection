name: Odkazy (týdně)

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept 200,403,429
            --exclude '^https://eur-lex\.europa\.eu'
            './**/*.md'
          fail: true
